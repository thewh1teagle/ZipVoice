[project]
name = "zipvoice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cn2an>=0.5.23",
    "huggingface-hub>=0.35.3",
    "inflect>=7.5.0",
    "jieba>=0.42.1",
    "lhotse>=1.32.0",
    "numpy>=2.3.3",
    "piper-phonemize>=1.3.0",
    "pydub>=0.25.1",
    "pypinyin>=0.55.0",
    "safetensors>=0.6.2",
    "setuptools<81",
    "tensorboard>=2.20.0",
    "tqdm>=4.67.1",
    "torch>=2.10.0",
    "torchaudio>=2.5.0",
    "vocos>=0.1.0",
]



[tool.isort]
profile = "black"

[tool.black]
line-length = 88

[tool.uv]
find-links = ["https://k2-fsa.github.io/icefall/piper_phonemize.html"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "bs4>=0.0.2",
]
